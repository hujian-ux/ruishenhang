openapi: 3.0.3
info:
  title: 企业 AI 智能体中台 · 后端接口契约
  version: 1.0.0
  description: >
    移动端 MVP（企微/钉钉/飞书 H5 嵌入）与 PC 共用后端的核心接口定义。
    所有接口在网关层校验 Bearer Token，并由网关从 Token 解析调用者身份注入
    X-Caller-Context 头（前端不可伪造）。召回类接口统一走单一过滤点
    （scope / owner / dept），越权内容在召回阶段即被剔除，不进入大模型上下文。
  contact:
    name: 平台管理员
servers:
  - url: /api/v1
    description: 统一 API 网关前缀
security:
  - bearerAuth: []
tags:
  - name: auth
    description: 身份认证（对接企业 IM）
  - name: rag
    description: 带权召回 / RAG 检索（核心，不可绕过）
  - name: agent
    description: Agent 触发（自然语言映射工作流）
  - name: approval
    description: 审批（入驻 / 共享 / 导出）
  - name: kb
    description: 知识库读写（个人 / 部门）
  - name: models
    description: 模型注册表（可插拔大模型接入，热插拔）
  - name: usage
    description: Token 用量统计与计费（按租户/部门/用户/智能体）
paths:
  /auth/sso/callback:
    post:
      tags: [auth]
      operationId: ssoCallback
      summary: SSO / OAuth 登录回调（企微/钉钉/飞书）
      description: 接收企业 IM 网页授权 code，换取员工身份与部门，并做设备绑定。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCallbackRequest'
            example:
              provider: wecom
              code: "im_oauth_code_abc123"
              device_id: "dev_88f2c1"
              state: "csrf_token_xyz"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoCallbackResponse'
              example:
                code: 0
                data:
                  token: "<jwt>"
                  expires_in: 7200
                  user:
                    userId: "u_1024"
                    name: "张三"
                    deptId: "d_sales"
                    role: "employee"
                  device_bound: true
                  need_stepup: false
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rag/retrieve:
    post:
      tags: [rag]
      operationId: ragRetrieve
      summary: 带权召回 / RAG 检索（核心，不可绕过）
      description: >
        与 PC 同一召回服务。网关注入调用者身份后，在召回阶段按 scope / owner / dept
        过滤，仅返回授权片段。filtered_out 仅返回被过滤的越权片段计数（不返回内容）。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveRequest'
            example:
              query: "五一活动话术"
              kb_scope: "all"
              top_k: 6
              tenant_id: "t_demo"
      responses:
        '200':
          description: 召回成功（结果已按权限过滤）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveResponse'
              example:
                code: 0
                data:
                  query: "五一活动话术"
                  hits:
                    - doc_id: "doc_8831"
                      title: "五一营销活动方案 v3"
                      snippet: "建议分三档：① 到店礼 ② 满减 ③ 老带新"
                      scope: "department"
                      kb_tier: "department"
                      score: 0.91
                      source: "产品手册 v3"
                      can_access: true
                  filtered_out: 3
                  trace_id: "trace_2026abc"
        '403':
          $ref: '#/components/responses/Forbidden'
  /agent/invoke:
    post:
      tags: [agent]
      operationId: agentInvoke
      summary: Agent 触发（自然语言映射工作流）
      description: >
        调用者上下文随任务下发，Agent 调用的工具（如 rag_retrieve）同样走带权召回。
        默认 SSE 流式返回，末帧为结构化结果。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentInvokeRequest'
            example:
              agent_id: "sales_script"
              input: "帮我写一版五一活动朋友圈文案"
              stream: true
      responses:
        '200':
          description: 调用成功（SSE 末帧）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInvokeResponse'
              example:
                code: 0
                data:
                  answer: "建议分三档执行五一活动：到店礼、满减、老带新……"
                  citations:
                    - doc_id: "doc_8831"
                      title: "五一营销活动方案 v3"
                      scope: "department"
                  tool_calls:
                    - tool: "rag_retrieve"
                      authorized: true
        '403':
          $ref: '#/components/responses/Forbidden'
  /agent/sessions:
    get:
      tags: [agent]
      operationId: listSessions
      summary: 会话列表（M7 会话管理）
      description: >
        返回调用者可见的会话列表（按最后更新时间倒序）。默认仅本人会话；
        `all=true` 仅平台管理员可用（运维排查），其他人传 all=true 返回 403。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 200 }
        - name: all
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: 仅平台管理员可传 true
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  count: 1
                  sessions:
                    - session_id: "sess_9f2b1c4d8e6a"
                      agent_id: "ag_sales_script"
                      turn_count: 4
                      last_role: "assistant"
                      last_message: "建议分三档执行五一活动……"
                      updated_at: 1793600000.0
        '403':
          $ref: '#/components/responses/Forbidden'
  /agent/sessions/{session_id}:
    get:
      tags: [agent]
      operationId: getSessionMemory
      summary: 查看会话记忆（M4，工程态扩展）
      description: >
        返回指定会话的轮次摘要与最近上下文预览。仅会话创建者本人可访问
        （第 18 章权限语义延伸到会话）；非本人访问 403。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 会话记忆
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMemory'
    delete:
      tags: [agent]
      operationId: deleteSession
      summary: 删除会话（M7 会话管理）
      description: >
        仅会话创建者本人可删；PG 副本一并删除，避免重启后会话复活。
        非本人访问 403，不存在 404。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data: { session_id: "sess_9f2b1c4d8e6a", deleted: true }
        '403':
          $ref: '#/components/responses/Forbidden'
  /agents:
    post:
      tags: [agent]
      operationId: registerAgent
      summary: 注册新智能体（写入选型结论）
      description: >
        新建智能体。adapter_type 来自模型选型向导结论（第 35 章）；knowledge_scope 受 RBAC 与
        单一过滤点约束（本人 / 负责人 / 部门 / 集团）。服务端以 caller 为准强制回填 owner_id / dept_id，
        前端传入仅作展示，越权写被过滤点拦截。注册后进入待发布评审（第 35 章红线：缺选型不可发布）。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRegisterRequest'
            example:
              agent_id: "contract_review"
              name: "合同合规审查助手"
              adapter_type: "llm_retrieval"
              description: "基于企业知识库问答必须 RAG；先做混合检索+重排，Recall@100≥0.95 门禁，再生成。"
              knowledge_scope: "department"
              model_id: "qwen-local"
      responses:
        '200':
          description: 注册成功（进入待发布评审）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRegisterResponse'
              example:
                code: 0
                data:
                  agent_id: "contract_review"
                  status: "pending_review"
                  adapter_type: "llm_retrieval"
                  registered_by: "u_1024"
        '403':
          $ref: '#/components/responses/Forbidden'
  /approval/{approval_id}/decide:
    post:
      tags: [approval]
      operationId: approvalDecide
      summary: 审批决策（入驻 / 共享 / 导出）
      description: 仅平台管理员 / 部门管理员 / 授权人可审批；操作人由网关解析，记录审计。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: approval_id
          in: path
          required: true
          description: 审批单 ID
          schema:
            type: string
            example: "ap_5502"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
            example:
              decision: "approve"
              comment: "同意，符合部门共享规范"
      responses:
        '200':
          description: 审批完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDecisionResponse'
              example:
                code: 0
                data:
                  approval_id: "ap_5502"
                  status: "approved"
                  decided_by: "u_admin_01"
                  decided_at: "2026-05-01T09:12:00Z"
                  audit_id: "audit_77"
        '403':
          $ref: '#/components/responses/Forbidden'
  /approval/pending:
    get:
      tags: [approval]
      operationId: listPendingApprovals
      summary: 待审列表（M5 工程态扩展）
      description: >
        platform_admin 返回全部待审单据；dept_admin 仅返回本部门发起的。
        智能体注册时自动开单（注册响应含 approval_id），审批通过后智能体
        pending_review → published（方可被 /agent/invoke 调用），驳回 → rejected。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      responses:
        '200':
          description: 待审单据列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      count: { type: integer }
                      tickets:
                        type: array
                        items:
                          type: object
                          properties:
                            approval_id: { type: string }
                            agent_id: { type: string }
                            requester_id: { type: string }
                            dept_id: { type: string }
                            status: { type: string, enum: [pending, approved, rejected] }
                            created_at: { type: number }
        '403':
          $ref: '#/components/responses/Forbidden'
  /kb/documents:
    get:
      tags: [kb]
      operationId: listKbDocuments
      summary: 知识文档列表（M6/M7，按第18章可见性过滤）
      description: 返回当前调用者可见的文档（个人 / 本部门 / global / owner），含字数、来源与是否已入检索索引。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      responses:
        '200':
          description: 文档列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  count: 1
                  object_store_available: true
                  documents:
                    - doc_id: "doc_5c1e9a73"
                      title: "2026 渠道政策"
                      scope: "department"
                      chars: 1284
                      source: "upload"
                      indexed: true
    post:
      tags: [kb]
      operationId: createKbDocument
      summary: 知识写入（个人 / 部门）
      description: >
        受 RBAC 与 scope 约束。服务端强制以 caller 为准回填 owner_id / dept_id / scope，
        前端传入仅作展示，防止越权写库（scope=department 时 dept_id 须等于 caller.deptId）。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KbDocumentRequest'
            example:
              title: "销售部五一活动话术集"
              content: "到店礼：到店即赠小样……"
              scope: "department"
              dept_id: "d_sales"
      responses:
        '200':
          description: 写入并向量化成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbDocumentResponse'
              example:
                code: 0
                data:
                  doc_id: "doc_9001"
                  scope: "department"
                  owner_id: "u_1024"
                  dept_id: "d_sales"
                  indexed: true
        '403':
          $ref: '#/components/responses/Forbidden'
  /kb/documents/upload:
    post:
      tags: [kb]
      operationId: uploadKbDocument
      summary: 知识文件上传（M7，multipart，落存储+入检索语料）
      description: >
        上传纯文本类文件（txt / md / csv / json / sql 等，≤512KB），服务端解码后
        写入对象存储（MinIO / S3 兼容）、登记权限元数据，并**同时进入检索索引**，
        上传完即可被 /rag/retrieve 与智能体对话召回。不支持的类型返回 415，
        超大文件 413，越权 scope（跨部门 / 员工写 global）403。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                  description: 留空则取文件名
                scope:
                  type: string
                  enum: [personal, department, global]
                  default: personal
                dept_id:
                  type: string
                  description: scope=department 时须等于 caller.deptId
      responses:
        '200':
          description: 上传并入库成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  doc_id: "doc_5c1e9a73"
                  title: "2026 渠道政策"
                  scope: "department"
                  chars: 1284
                  indexed: true
                  storage: "minio://kb-files/kb/t_demo/doc_5c1e9a73.txt"
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: 文件超过 512KB
        '415':
          description: 文件类型不支持或无法解码为文本
  /kb/documents/{doc_id}:
    delete:
      tags: [kb]
      operationId: deleteKbDocument
      summary: 删除知识文档（M7，三处同步清理）
      description: >
        同步清理文档注册表、检索语料、对象存储原文，避免"删了还能召回"。
        非本人可见范围 403，不存在 404。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: doc_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data: { doc_id: "doc_5c1e9a73", deleted: true, retrieval_purged: true }
        '403':
          $ref: '#/components/responses/Forbidden'
  /models:
    get:
      tags: [models]
      operationId: listModels
      summary: 列出已注册模型（可插拔模型注册表）
      description: >
        返回当前注册表中的所有模型适配器及其能力、状态、单价与配额。
        新增模型只需实现 ModelAdapter 并登记到 Registry，业务侧无需改动。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, inactive, all]
            default: active
      responses:
        '200':
          description: 模型列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
              example:
                code: 0
                data:
                  models:
                    - model_id: "gpt-4o-mini"
                      vendor: "openai"
                      capabilities: ["chat", "stream"]
                      context_window: 128000
                      status: "active"
                      price_per_1k_prompt: 0.00015
                      price_per_1k_completion: 0.0006
                    - model_id: "qwen-local"
                      vendor: "private"
                      capabilities: ["chat", "embed"]
                      context_window: 32000
                      status: "active"
                      price_per_1k_prompt: 0
                      price_per_1k_completion: 0
    post:
      tags: [models]
      operationId: registerModel
      summary: 注册 / 启用一个新模型适配器（热插拔）
      description: >
        由平台管理员登记新模型。仅登记元数据与适配器标识，业务调用方通过 model_id 透明路由，
        不感知底层厂商差异。参数仅平台管理员可写。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRegisterRequest'
            example:
              model_id: "claude-sonnet"
              vendor: "anthropic"
              adapter: "openai_compatible"
              capabilities: ["chat", "stream"]
              context_window: 200000
              price_per_1k_prompt: 0.003
              price_per_1k_completion: 0.015
              default_quota: 1000000
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRegisterResponse'
              example:
                code: 0
                data:
                  model_id: "claude-sonnet"
                  status: "active"
                  registered_by: "u_admin_01"
        '403':
          $ref: '#/components/responses/Forbidden'
  /models/gateway:
    get:
      tags: [models]
      operationId: gatewayHealth
      summary: 模型网关探活（M7 页面状态灯）
      description: 返回 LiteLLM 是否可达、网关地址与当前默认路由模型；不可达时业务自动回退 stub。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      responses:
        '200':
          description: 网关状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  available: true
                  base_url: "http://127.0.0.1:4000"
                  default_model: "qwen-plus"
                  probe: "live"
  /models/{model_id}:
    patch:
      tags: [models]
      operationId: patchModelStatus
      summary: 启停模型（M7，仅平台管理员）
      description: 网关侧即时生效的下线能力：停用后 /models（默认 active）不再返回该模型，业务代码零改动。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: model_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, inactive] }
      responses:
        '200':
          description: 状态已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  model: { model_id: "qwen-turbo", status: "inactive" }
                  changed_by: "u_9000"
        '403':
          $ref: '#/components/responses/Forbidden'
  /usage:
    get:
      tags: [usage]
      operationId: queryUsage
      summary: 查询 Token 用量与计费（按维度聚合）
      description: >
        返回指定维度的 token 用量与成本。维度支持 tenant / dept / user / agent / session。
        用量数据受 scope 约束：部门只能查本部门，跨部门汇总仅平台管理员可见（cost 属敏感指标）。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: dimension
          in: query
          required: false
          schema:
            type: string
            enum: [dept, agent, model, user, day]
            default: dept
          description: 聚合维度（M7 真实数据源：每次调用落账后聚合）
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
          description: 回溯窗口（天），与部门配额窗口一致
      responses:
        '200':
          description: 用量聚合结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
              example:
                code: 0
                data:
                  dimension: "dept"
                  window_days: 30
                  quota_tokens: 2000000
                  cost_currency: "CNY"
                  total: { calls: 12, real_calls: 12, stub_calls: 0, total_tokens: 18420, cost: 0.0213 }
                  rows:
                    - key: "d_sales"
                      calls: 12
                      prompt_tokens: 14200
                      completion_tokens: 4220
                      total_tokens: 18420
                      cost: 0.0213
                      quota: 2000000
                      quota_used_pct: 0.92
  /usage/records:
    get:
      tags: [usage]
      operationId: listUsageRecords
      summary: 调用明细（M7，每行一单可对账）
      description: >
        按权限收敛返回最近调用明细：时间 / 智能体 / 模型 / 入出 token / 成本 /
        真伪生成 / 延迟。员工仅本人，部门管理员仅本部门，平台管理员全量。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: 明细列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  count: 1
                  cost_currency: "CNY"
                  records:
                    - time: "2026-11-02 18:40:12"
                      agent_id: "ag_sales_script"
                      model_id: "qwen-plus"
                      prompt_tokens: 412
                      completion_tokens: 128
                      cost: 0.000586
                      real: true
                      latency_ms: 1830
  /usage/quota:
    get:
      tags: [usage]
      operationId: getQuotaStatus
      summary: 部门配额水位（M7 红线）
      description: >
        返回本部门滚动窗口 token 用量与配额水位；超限时 /agent/invoke 直接返回 429，
        不是事后告警。quota_tokens=0 表示不限额。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      responses:
        '200':
          description: 配额状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  dept_id: "d_sales"
                  quota_tokens: 2000000
                  used_tokens: 18420
                  remaining_tokens: 1981580
                  used_pct: 0.92
                  exceeded: false
                  window_days: 30

  # ───────────────────────── M8 试点（Pilot-Ready） ─────────────────────────
  /kb/documents/bulk:
    post:
      tags: [kb]
      operationId: bulkUploadKbDocuments
      summary: 多文件批量上传（M8，服务端去重 + 只重建一次索引）
      description: >
        一次请求收多篇（≤50），同租户内内容指纹（sha256）相同的只入一次，返回 duplicated 与既有 doc_id；
        重跑导入幂等。单次上限 50 篇，更大规模走 `scripts/ingest_corpus.py` 目录导入。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                scope:
                  type: string
                  enum: [personal, department, global]
                  default: department
                dept_id:
                  type: string
      responses:
        '200':
          description: 逐文件结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  added: 2
                  duplicated: 0
                  total: 2
                  skipped: 0
                  chars_added: 1280
                  failed: []
                  docs:
                    - {title: "区域价格表", doc_id: "doc_3f8a1c02", duplicated: false, filename: "区域价格表.txt", chars: 620}
        '403':
          description: 越权写（跨部门 / 员工写 global）
        '413':
          description: 超过单次文件数上限

  /kb/stats:
    get:
      tags: [kb]
      operationId: getKbStats
      summary: 语料画像（M8，试点每日开机第一屏）
      description: >
        语料规模 / 范围与来源分布 / 超长截断篇数 / 对象存储与 PG 状态。
        `pg_available=false` 表示重启后语料会丢，试点期间必须为 true。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      responses:
        '200':
          description: 语料画像
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  documents: 250
                  total_chars: 73919
                  avg_chars: 295.7
                  by_scope: {department: 250}
                  by_dept: {d_sales: 250}
                  by_source: {bulk_import: 250}
                  truncated_documents: 0
                  unique_hashes: 250
                  index_char_cap: 20000
                  object_store_available: true
                  pg_available: true
                  pg_persisted: true

  /kb/index:
    get:
      tags: [kb]
      operationId: getKbIndex
      summary: 索引健康（M9，规模化后第一诊断屏）
      description: >
        规模（父文档 / 子块 / 已分配容量 / tombstone / 词表）+ 构建耗时 +
        最近一次查询延迟 + embedding 缓存命中 + 向量后端。试点排障第一眼看的接口：
        「为什么今天回答变慢」「重启后多久能恢复」都在这一屏回答。
        `vector_store.backend` 为 memory 表示跑在进程内 numpy 矩阵；
        切 qdrant 时 `available=false` 会自动降级回 memory 并在 `error` 里写明原因。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      responses:
        '200':
          description: 索引健康画像
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  documents: 2720
                  children: 33712
                  children_allocated: 33712
                  tombstones: 0
                  vocab: 3652
                  avg_child_tokens: 33.16
                  chars: 788792
                  depts: 1
                  by_scope: {department: 2720}
                  demo_documents: 0
                  build_ms: 0.0
                  vector_backend: numpy
                  vec_bytes: 138084352
                  last_query_ms: 17.71
                  query_count: 36
                  max_children: 200000
                  capacity_used_pct: 0.16856
                  embed_cache:
                    enabled: true
                    available: true
                    entries: 33712
                    hits: 33712
                    misses: 0
                    hit_rate: 1.0
                    pending: 0
                    errors: 0
                  vector_store:
                    requested: memory
                    backend: memory
                    available: false
                    points: null
                    mode: http
                    error: null

  /kb/ingest:
    post:
      tags: [kb]
      operationId: createKbIngestJob
      summary: 异步导入任务（M10，万篇级：提交即返回）
      description: >
        同步 `/kb/documents/bulk` 一次最多 50 个文件、请求里等结果；1 万篇要分 200 次请求。
        这里一次提交整批（≤20000 篇），服务端单 worker 每 200 篇一批入库，
        返回 `job_id` 由 `GET /kb/ingest/{job_id}` 轮询进度。
        任务单只存内存，重启丢任务单不丢数据（已入库的文档在 PG）。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents:
                  type: array
                  items:
                    type: object
                    required: [content]
                    properties:
                      title: {type: string}
                      content: {type: string}
                      filename: {type: string}
                scope: {type: string, enum: [personal, department, global], default: department}
                dept_id: {type: string, nullable: true}
            example:
              documents:
                - {title: "2026 渠道政策", filename: "渠道政策.md", content: "一级经销商年度返点 8%…"}
                - {title: "售后备件", filename: "备件.md", content: "常用备件安全库存 20 套…"}
              scope: department
      responses:
        '200':
          description: 任务已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  job_id: job_4cae2b30ac
                  status: running
                  total: 1200
                  processed: 0
                  added: 0
                  duplicated: 0
                  failed: 0
                  failures: []
                  scope: department
                  dept_id: d_sales
                  object_store_available: true
        '400':
          description: documents 为空
        '403':
          description: 越权范围（跨部门 / 员工写 global）
        '413':
          description: 单任务超过 20000 篇
    get:
      tags: [kb]
      operationId: listKbIngestJobs
      summary: 最近导入任务（本人；平台管理员看全租户）
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: limit
          in: query
          schema: {type: integer, default: 20, maximum: 100}
      responses:
        '200':
          description: 任务列表（新→旧）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  count: 1
                  jobs:
                    - {job_id: job_4cae2b30ac, status: done, total: 1200, processed: 1200, added: 1198, duplicated: 2, failed: 0, elapsed_s: 11.4}

  /kb/ingest/{job_id}:
    get:
      tags: [kb]
      operationId: getKbIngestJob
      summary: 查导入进度（processed 单调递增，status=done 即完成）
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  job_id: job_4cae2b30ac
                  status: done
                  total: 1200
                  processed: 1200
                  added: 1198
                  duplicated: 2
                  failed: 0
                  failures: []
                  chars_added: 512340
                  elapsed_s: 11.4
                  error: null
        '404':
          description: 任务不存在或无权查看

  /kb/ingest/{job_id}/cancel:
    post:
      tags: [kb]
      operationId: cancelKbIngestJob
      summary: 取消导入（尽力而为：当前批跑完就停，已入库的不回滚）
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 已请求取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data: {job_id: job_4cae2b30ac, status: cancelling}
        '409':
          description: 任务不存在、已终态或无权取消

  /usage/trend:
    get:
      tags: [usage]
      operationId: getUsageTrend
      summary: 成本曲线（M8，逐日真落账 + 月末外推 + 预算水位）
      description: >
        按自然日连续补齐（没有调用的日子补 0，避免折线把空白日连成直线）。
        月末外推 = 本月已发生 + 近 7 个自然日日均 × 当月剩余天数。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: days
          in: query
          schema: {type: integer, minimum: 1, maximum: 365, default: 14}
      responses:
        '200':
          description: 成本趋势
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  window_days: 14
                  series:
                    - {date: "2026-11-02", calls: 66, real_calls: 0, tokens: 11204, cost: 0.0291}
                  calls: 66
                  tokens: 11204
                  cost: 0.0291
                  active_days: 1
                  zero_days: 13
                  peak_day: {date: "2026-11-02", cost: 0.0291}
                  month_to_date_cost: 0.0291
                  days_in_month: 30
                  elapsed_days: 2
                  avg_7d_cost: 0.0042
                  projected_month_cost: 0.15
                  budget_cny: 500.0
                  budget_used_pct: 0.01
                  projected_budget_pct: 0.03
                  budget_status: ok
                  currency: CNY

  /eval/latest:
    get:
      tags: [eval]
      operationId: getLatestEval
      summary: 最近一次 RAG 基线报告（M8）
      description: >
        先读 `backend/reports/latest.json`（由 `scripts/eval_baseline.py` 落盘）；
        没有报告时用内置 golden 现算一遍（`source=computed`，不落盘）。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      responses:
        '200':
          description: 基线报告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /eval/history:
    get:
      tags: [eval]
      operationId: getEvalHistory
      summary: 基线漂移序列（M8，每天跑一次看召回是否下滑）
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 30}
      responses:
        '200':
          description: 漂移历史
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /eval/run:
    post:
      tags: [eval]
      operationId: runEval
      summary: 现场跑一次基线并落盘（M8，仅部门管理员/平台管理员）
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: limit
          in: query
          description: 只跑前 N 条 golden（0 = 全部）
          schema: {type: integer, minimum: 0, maximum: 2000, default: 0}
      responses:
        '200':
          description: 本次报告（同时写入 latest.json 与 history.jsonl）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '403':
          description: 员工无权触发跑批

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CallerContext:
      name: X-Caller-Context
      in: header
      required: false
      description: >
        由网关从 Bearer Token 解析并注入，前端不可伪造。
        格式：userId,deptId,role 经服务端签名，例 u_1024|d_sales|employee
      schema:
        type: string
  responses:
    Unauthorized:
      description: 未认证或 Token 失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: "unauthorized"
    Forbidden:
      description: 无权限（角色/范围不满足，或越权访问被过滤点拦截）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: "forbidden: scope not allowed"
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
          example: 403
        message:
          type: string
          example: "forbidden"
    GenericResponse:
      type: object
      description: 通用返回包装（M7 工程态端点：data 结构随端点而定）
      properties:
        code: { type: integer, example: 0 }
        data: { type: object, additionalProperties: true }
    SsoCallbackRequest:
      type: object
      required: [provider, code, device_id]
      properties:
        provider:
          type: string
          enum: [wecom, dingtalk, feishu]
        code:
          type: string
          description: IM 回调授权码（一次性）
        device_id:
          type: string
          description: 设备指纹，用于绑定与换机二次验证
        state:
          type: string
          description: 防 CSRF
    SsoCallbackResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            token:
              type: string
            expires_in:
              type: integer
              example: 7200
            user:
              $ref: '#/components/schemas/User'
            device_bound:
              type: boolean
            need_stepup:
              type: boolean
              description: 换设备时为 true，需二次验证
    User:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        deptId:
          type: string
        role:
          type: string
          enum: [employee, dept_admin, platform_admin]
    RetrieveRequest:
      type: object
      required: [query, tenant_id]
      properties:
        query:
          type: string
          description: 用户自然语言问题（经脱敏后入参）
        kb_scope:
          type: string
          enum: [all, department, personal]
          default: all
          description: 仍受调用者身份约束
        top_k:
          type: integer
          default: 6
          maximum: 20
        tenant_id:
          type: string
          description: 企业租户隔离
    RetrieveHit:
      type: object
      properties:
        doc_id:
          type: string
        title:
          type: string
        snippet:
          type: string
        scope:
          type: string
          enum: [global, department, personal]
        kb_tier:
          type: string
        score:
          type: number
          format: float
        source:
          type: string
        can_access:
          type: boolean
          description: 已通过过滤点，必然为 true
    RetrieveResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            query:
              type: string
            hits:
              type: array
              items:
                $ref: '#/components/schemas/RetrieveHit'
            filtered_out:
              type: integer
              description: 被过滤的越权片段数（审计用，不返回内容）
            trace_id:
              type: string
    AgentInvokeRequest:
      type: object
      required: [agent_id, input]
      properties:
        agent_id:
          type: string
        input:
          type: string
          description: 用户输入（语音经 ASR 转写后传入）
        stream:
          type: boolean
          default: true
        session_id:
          type: string
          description: 会话记忆（M4）：传入则续聊既有会话，缺省新建；会话仅创建者本人可见
    SessionMemory:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
        data:
          type: object
          properties:
            session_id: { type: string }
            agent_id: { type: string }
            user_id: { type: string }
            turn_count: { type: integer }
            created_at: { type: number }
            context_preview:
              type: string
              description: 最近若干轮对话的文本预览（滑动窗口截断）
    Citation:
      type: object
      properties:
        doc_id:
          type: string
        title:
          type: string
        scope:
          type: string
    AgentInvokeResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            answer:
              type: string
            citations:
              type: array
              items:
                $ref: '#/components/schemas/Citation'
            tool_calls:
              type: array
              items:
                type: object
                properties:
                  tool:
                    type: string
                  authorized:
                    type: boolean
    AgentRegisterRequest:
      type: object
      required: [name, adapter_type, description, knowledge_scope]
      properties:
        agent_id:
          type: string
          description: 业务侧使用的智能体标识（路由键），缺省由 name 生成
        name:
          type: string
          description: 智能体名称
        adapter_type:
          type: string
          enum: [rule, ml_serving, llm, llm_retrieval, ml_llm_retrieval]
          description: >
            来自第 35 章选型向导结论。rule=规则引擎/传统ML；ml_serving=传统ML服务；
            llm=大模型；llm_retrieval=RAG（检索增强）；ml_llm_retrieval=数据分析+RAG 混合
        description:
          type: string
          description: 选型说明（为何选该 adapter）
        knowledge_scope:
          type: string
          enum: [personal, owner, department, global]
          description: 多人知识库可见范围；服务端强制等于 caller 权限，越权写被过滤点拦截
        model_id:
          type: string
          description: 选用的已注册模型（见 /models），可空由平台默认
        selection_rationale:
          type: object
          description: 选型向导上下文（仅记录，便于审计/评审）
          properties:
            recommended:
              type: string
            landing_chapters:
              type: string
    AgentRegisterResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            agent_id:
              type: string
            status:
              type: string
              enum: [pending_review, active, rejected]
            adapter_type:
              type: string
            registered_by:
              type: string
    ApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        comment:
          type: string
    ApprovalDecisionResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            approval_id:
              type: string
            status:
              type: string
              enum: [approved, rejected]
            decided_by:
              type: string
            decided_at:
              type: string
              format: date-time
            audit_id:
              type: string
    KbDocumentRequest:
      type: object
      required: [title, content, scope]
      properties:
        title:
          type: string
        content:
          type: string
          description: 正文（入库自动向量化）
        scope:
          type: string
          enum: [personal, department, global]
          description: global 仅平台管理员
        dept_id:
          type: string
          description: scope=department 时必填，强制等于 caller.deptId
    KbDocumentResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            doc_id:
              type: string
            scope:
              type: string
            owner_id:
              type: string
            dept_id:
              type: string
            indexed:
              type: boolean
    ModelInfo:
      type: object
      properties:
        model_id:
          type: string
          description: 业务侧使用的模型标识（路由键）
        vendor:
          type: string
          description: 厂商或部署方，private 表示私有化
        adapter:
          type: string
          description: 适配器类型，如 openai_compatible
        capabilities:
          type: array
          items:
            type: string
            enum: [chat, embed, rerank, stream]
        context_window:
          type: integer
          description: 上下文长度（token）
        status:
          type: string
          enum: [active, inactive]
        price_per_1k_prompt:
          type: number
          format: float
        price_per_1k_completion:
          type: number
          format: float
    ModelListResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            models:
              type: array
              items:
                $ref: '#/components/schemas/ModelInfo'
    ModelRegisterRequest:
      type: object
      required: [model_id, vendor, adapter, capabilities, context_window]
      properties:
        model_id:
          type: string
        vendor:
          type: string
        adapter:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum: [chat, embed, rerank, stream]
        context_window:
          type: integer
        price_per_1k_prompt:
          type: number
          format: float
        price_per_1k_completion:
          type: number
          format: float
        default_quota:
          type: integer
          description: 默认部门/智能体月度配额（token）
    ModelRegisterResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            model_id:
              type: string
            status:
              type: string
              enum: [active, inactive]
            registered_by:
              type: string
    UsageRow:
      type: object
      properties:
        key:
          type: string
          description: 维度值（部门ID/用户ID/智能体ID等）
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        cost:
          type: number
          format: float
          description: 折算成本（内部结算货币）
        quota:
          type: number
          description: 周期内配额
        quota_used_pct:
          type: number
          format: float
          description: 配额已用百分比
    UsageSummary:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            dimension:
              type: string
              enum: [tenant, dept, user, agent, session]
            period:
              type: string
              description: 统计周期，如 2026-10
            rows:
              type: array
              items:
                $ref: '#/components/schemas/UsageRow'
