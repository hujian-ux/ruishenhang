      summary: Query Usage
      operationId: query_usage_api_v1_usage_summary_get
      parameters:
      - name: dimension
        in: query
        required: false
        schema:
          type: string
          description: dept|agent|model|user|day
          default: dept
          title: Dimension
        description: dept|agent|model|user|day
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          description: 回溯窗口（天）
          default: 30
          title: Days
        description: 回溯窗口（天）
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /usage/trend:
    get:
      tags:
      - usage
      summary: Usage Trend
      description: '成本曲线（M8 试点）：逐日用量/成本 + 月累计 + 月末外推 + 预算水位。


        面试/评审常问「这套东西一个月烧多少钱」——这里给的是真落账数据外推，

        不是拍脑袋的单价表。'
      operationId: usage_trend_api_v1_usage_trend_get
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          description: 回溯天数（自然日，连续补齐）
          default: 14
          title: Days
        description: 回溯天数（自然日，连续补齐）
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /zh/segment:
    post:
      tags:
      - quality
      summary: Zh Segment
      description: 中文语义边界切分（保留标点，长句切到 <=60 字）。
      operationId: zh_segment_api_v1_zh_segment_post
      parameters:
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
