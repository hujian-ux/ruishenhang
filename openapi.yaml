  # ───────────────────────── M8 试点（Pilot-Ready） ─────────────────────────
  /kb/documents/bulk:
    post:
      tags: [kb]
      operationId: bulkUploadKbDocuments
      summary: 多文件批量上传（M8，服务端去重 + 只重建一次索引）
      description: >
        一次请求收多篇（≤50），同租户内内容指纹（sha256）相同的只入一次，返回 duplicated 与既有 doc_id；
        重跑导入幂等。单次上限 50 篇，更大规模走 `scripts/ingest_corpus.py` 目录导入。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                scope:
                  type: string
                  enum: [personal, department, global]
                  default: department
                dept_id:
                  type: string
      responses:
        '200':
          description: 逐文件结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  added: 2
                  duplicated: 0
                  total: 2
                  skipped: 0
                  chars_added: 1280
                  failed: []
                  docs:
                    - {title: "区域价格表", doc_id: "doc_3f8a1c02", duplicated: false, filename: "区域价格表.txt", chars: 620}
        '403':
          description: 越权写（跨部门 / 员工写 global）
        '413':
          description: 超过单次文件数上限

