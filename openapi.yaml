                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data: { doc_id: "doc_5c1e9a73", deleted: true, retrieval_purged: true }
        '403':
          $ref: '#/components/responses/Forbidden'
  /models:
