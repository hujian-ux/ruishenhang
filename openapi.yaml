            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      count: { type: integer }
                      tickets:
                        type: array
                        items:
                          type: object
                          properties:
                            approval_id: { type: string }
                            agent_id: { type: string }
                            requester_id: { type: string }
                            dept_id: { type: string }
                            status: { type: string, enum: [pending, approved, rejected] }
                            created_at: { type: number }
        '403':
          $ref: '#/components/responses/Forbidden'
  /kb/documents:
    get:
      tags: [kb]
      operationId: listKbDocuments
      summary: 知识文档列表（M6/M7，按第18章可见性过滤）
      description: 返回当前调用者可见的文档（个人 / 本部门 / global / owner），含字数、来源与是否已入检索索引。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      responses:
        '200':
          description: 文档列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  count: 1
                  object_store_available: true
                  documents:
                    - doc_id: "doc_5c1e9a73"
                      title: "2026 渠道政策"
                      scope: "department"
                      chars: 1284
                      source: "upload"
                      indexed: true
    post:
      tags: [kb]
      operationId: createKbDocument
      summary: 知识写入（个人 / 部门）
      description: >
        受 RBAC 与 scope 约束。服务端强制以 caller 为准回填 owner_id / dept_id / scope，
        前端传入仅作展示，防止越权写库（scope=department 时 dept_id 须等于 caller.deptId）。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KbDocumentRequest'
            example:
              title: "销售部五一活动话术集"
              content: "到店礼：到店即赠小样……"
              scope: "department"
              dept_id: "d_sales"
      responses:
        '200':
          description: 写入并向量化成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbDocumentResponse'
              example:
                code: 0
                data:
                  doc_id: "doc_9001"
                  scope: "department"
                  owner_id: "u_1024"
                  dept_id: "d_sales"
                  indexed: true
        '403':
          $ref: '#/components/responses/Forbidden'
  /kb/documents/upload:
    post:
      tags: [kb]
      operationId: uploadKbDocument
      summary: 知识文件上传（M7，multipart，落存储+入检索语料）
      description: >
        上传纯文本类文件（txt / md / csv / json / sql 等，≤512KB），服务端解码后
        写入对象存储（MinIO / S3 兼容）、登记权限元数据，并**同时进入检索索引**，
        上传完即可被 /rag/retrieve 与智能体对话召回。不支持的类型返回 415，
        超大文件 413，越权 scope（跨部门 / 员工写 global）403。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                  description: 留空则取文件名
                scope:
                  type: string
                  enum: [personal, department, global]
                  default: personal
                dept_id:
                  type: string
                  description: scope=department 时须等于 caller.deptId
      responses:
        '200':
          description: 上传并入库成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  doc_id: "doc_5c1e9a73"
                  title: "2026 渠道政策"
                  scope: "department"
                  chars: 1284
                  indexed: true
                  storage: "minio://kb-files/kb/t_demo/doc_5c1e9a73.txt"
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: 文件超过 512KB
        '415':
          description: 文件类型不支持或无法解码为文本
  /kb/documents/{doc_id}:
    delete:
