  # M27-AUTOGEN-END
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CallerContext:
      name: X-Caller-Context
      in: header
      required: false
      description: >
        由网关从 Bearer Token 解析并注入，前端不可伪造。
        格式：userId,deptId,role 经服务端签名，例 u_1024|d_sales|employee
      schema:
        type: string
  responses:
    Unauthorized:
      description: 未认证或 Token 失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: "unauthorized"
    Forbidden:
      description: 无权限（角色/范围不满足，或越权访问被过滤点拦截）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: "forbidden: scope not allowed"
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
          example: 403
        message:
          type: string
          example: "forbidden"
    GenericResponse:
      type: object
      description: 通用返回包装（M7 工程态端点：data 结构随端点而定）
      properties:
        code: { type: integer, example: 0 }
        data: { type: object, additionalProperties: true }
    SsoCallbackRequest:
      type: object
      required: [provider, code, device_id]
      properties:
        provider:
          type: string
          enum: [wecom, dingtalk, feishu]
        code:
          type: string
          description: IM 回调授权码（一次性）
        device_id:
          type: string
          description: 设备指纹，用于绑定与换机二次验证
        state:
          type: string
          description: 防 CSRF
    SsoCallbackResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            token:
              type: string
            expires_in:
              type: integer
              example: 7200
            user:
              $ref: '#/components/schemas/User'
            device_bound:
              type: boolean
            need_stepup:
              type: boolean
              description: 换设备时为 true，需二次验证
    User:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        deptId:
          type: string
        role:
          type: string
          enum: [employee, dept_admin, platform_admin]
    RetrieveRequest:
      type: object
      required: [query, tenant_id]
      properties:
        query:
          type: string
          description: 用户自然语言问题（经脱敏后入参）
        kb_scope:
          type: string
          enum: [all, department, personal]
          default: all
          description: 仍受调用者身份约束
        top_k:
          type: integer
          default: 6
          maximum: 20
        tenant_id:
          type: string
          description: 企业租户隔离
    RetrieveHit:
      type: object
      properties:
        doc_id:
          type: string
        title:
          type: string
        snippet:
          type: string
        scope:
          type: string
          enum: [global, department, personal]
        kb_tier:
          type: string
        score:
          type: number
          format: float
        source:
          type: string
        can_access:
          type: boolean
          description: 已通过过滤点，必然为 true
        snippets:
          type: array
          items:
            type: string
          description: 同一篇文档按相关度取前 3 句（去重），供制度查证类技能并列比对条款；缺省为空数组
    WebSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: 检索问题（截断至 200 字）
        top_k:
          type: integer
          minimum: 1
          maximum: 10
          default: 6
        fetch_top:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
          description: 抓前 N 条结果正文；只允许本轮搜到的 URL，竞品调研用
    WebSearchHit:
      type: object
      required: [title, url, origin]
      properties:
        title: { type: string }
        url: { type: string, format: uri }
        snippet: { type: string }
        content:
          type: string
          description: 可选正文摘录（fetch_top > 0 且通过安全校验时才有）
        origin:
          type: string
          enum: [public_web]
          description: 固定为 public_web，与内部授权片段区分
        source:
          type: string
          description: provider 名，如 bing_html / bocha / serper
        published_at: { type: string }
        fetched_at: { type: string }
        fetch_error:
          type: string
          description: 正文抓取失败原因（不影响检索结果本身）
    WebSearchResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          required: [query, ok, degraded, mode, provider, hits]
          properties:
            query: { type: string }
            top_k: { type: integer }
            provider: { type: string }
            mode:
              type: string
              enum: [api, free_html, fallback_html, mock, unavailable, disabled, invalid_query]
            ok:
              type: boolean
              description: 是否拿到可用结果；false 时模型必须写「未检索到公开信息」
            degraded:
              type: boolean
              description: 官方通道失败已降级到网页抓取，结论需人工复核
            error: { type: string }
            fallback_from: { type: string }
            elapsed_ms: { type: integer }
            fetched_at: { type: string }
            origin: { type: string, example: public_web }
            hits:
              type: array
              items:
                $ref: '#/components/schemas/WebSearchHit'
    RetrieveResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            query:
              type: string
            hits:
              type: array
              items:
                $ref: '#/components/schemas/RetrieveHit'
            filtered_out:
              type: integer
              description: 被过滤的越权片段数（审计用，不返回内容）
            trace_id:
              type: string
    AgentInvokeRequest:
      type: object
      required: [agent_id, input]
      properties:
        agent_id:
          type: string
        input:
          type: string
          description: 用户输入（语音经 ASR 转写后传入）
        stream:
          type: boolean
          default: true
        session_id:
          type: string
          description: 会话记忆（M4）：传入则续聊既有会话，缺省新建；会话仅创建者本人可见
        file_ids:
          type: array
          items:
            type: string
          description: |
            文件进出（M16）：先 POST /agent/files 上传拿 file_id，再在此引用。
            后端会把附件解析成「列画像 + 样本行」注入上下文（不是整表塞进 prompt），
            执行后自动生成产出物，地址见响应 data.artifacts。
        output_formats:
          type: array
          items:
            type: string
            enum: [xlsx, docx, pptx, html, pdf, auto]
          description: |
            产出物格式（M17），可多选，例如 ["xlsx","pptx","pdf"]。
            **模型只调一次**，多格式是同一份答案的不同排版，不额外消耗 token。
            - 不传 → xlsx（保持 M16 行为）
            - auto → 按技能包 outputs_contract 关键词猜（汇报/PPT→pptx，文档→docx，归档→pdf）
            单格式渲染失败不拖垮整单：失败项见 data.artifact_errors。
    AgentFile:
      type: object
      description: 文件元信息（M16）。字节流在对象存储，这里只回元信息与下载地址。
      properties:
        file_id:
          type: string
        kind:
          type: string
          enum: [upload, artifact]
          description: upload=用户上传的输入件；artifact=技能包执行生成的产出物
        filename:
          type: string
        size:
          type: integer
        content_type:
          type: string
        sha256:
          type: string
        agent_id:
          type: string
          description: 产出物所属智能体（上传件为空）
        run_id:
          type: string
          description: 产出物所属本次执行（上传件为空）
        created_at:
          type: number
        meta:
          type: object
          description: 上传件含 parse_ok/sheets/rows/store；产出物含 input_files/table_count
        download_url:
          type: string
          description: 下载地址（后端代理、带鉴权，不是对象存储直链）
    SessionMemory:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
        data:
          type: object
          properties:
            session_id: { type: string }
            agent_id: { type: string }
            user_id: { type: string }
            title:
              type: string
              description: 首条用户输入截断而来，供侧栏历史列表显示（不回显内部 session_id）
            turn_count: { type: integer }
            created_at: { type: number }
            turns:
              type: array
              description: >
                完整轮次，供界面打开历史对话时恢复。产出物挂在助手轮上（artifacts），
                真模型标记同理（llm_real）——只放当次响应里的话，刷新一次就丢了。
              items:
                type: object
                properties:
                  role: { type: string, enum: [user, assistant] }
                  content: { type: string }
                  ts: { type: number }
                  llm_real:
                    type: boolean
                    description: 这轮是否走真模型；false 表示占位答案，不可对外使用
                  artifacts:
                    type: array
                    items: { $ref: '#/components/schemas/AgentFile' }
            context_preview:
              type: string
              description: 最近若干轮对话的文本预览（滑动窗口截断，即真正注入生成器的那段）
    Citation:
      type: object
      properties:
        doc_id:
          type: string
        title:
          type: string
        scope:
          type: string
    AgentInvokeResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            answer:
              type: string
            citations:
              type: array
              items:
                $ref: '#/components/schemas/Citation'
            tool_calls:
              type: array
              items:
                type: object
                properties:
                  tool:
                    type: string
                  authorized:
                    type: boolean
    AgentRegisterRequest:
      type: object
      required: [name, adapter_type, description, knowledge_scope]
      properties:
        agent_id:
          type: string
          description: 业务侧使用的智能体标识（路由键），缺省由 name 生成
        name:
          type: string
          description: 智能体名称
        adapter_type:
          type: string
          enum: [rule, ml_serving, llm, llm_retrieval, ml_llm_retrieval]
          description: >
            来自第 35 章选型向导结论。rule=规则引擎/传统ML；ml_serving=传统ML服务；
            llm=大模型；llm_retrieval=RAG（检索增强）；ml_llm_retrieval=数据分析+RAG 混合
        description:
          type: string
          description: 选型说明（为何选该 adapter）
        knowledge_scope:
          type: string
          enum: [personal, owner, department, global]
          description: 多人知识库可见范围；服务端强制等于 caller 权限，越权写被过滤点拦截
        model_id:
          type: string
          description: 选用的已注册模型（见 /models），可空由平台默认
        selection_rationale:
          type: object
          description: 选型向导上下文（仅记录，便于审计/评审）
          properties:
            recommended:
              type: string
            landing_chapters:
              type: string
        system_prompt:
          type: string
          description: 技能包执行提示词（M15）。缺省时该智能体退回平台默认知识助手行为
        category:
          type: string
          enum: [industry, office]
          description: 大分类（行业方案 / 办公角色）
        category_cn:
          type: string
          description: 分类中文名（制造业 / 零售 / 跨境电商 / 办公角色）
        sub_function:
          type: string
          description: 办公角色下的子职能（HR / 行政 / 财务 / 销售）
        tags:
          type: array
          items:
            type: string
        source_path:
          type: string
          description: 技能包来源路径，用于版本回流与幂等重导入
        inputs_contract:
          type: string
          description: 输入契约（缺哪些输入必须显式列出，不得臆造）
        outputs_contract:
          type: string
          description: 产出契约
    AgentImportItem:
      type: object
      required: [name, description, system_prompt]
      properties:
        name:
          type: string
        description:
          type: string
        system_prompt:
          type: string
        adapter_type:
          type: string
          enum: [rule, ml_serving, llm, llm_retrieval, ml_llm_retrieval]
          default: llm
        knowledge_scope:
          type: string
          enum: [personal, owner, department, global]
          default: department
        category:
          type: string
          enum: [industry, office]
        category_cn:
          type: string
        sub_function:
          type: string
        tags:
          type: array
          items:
            type: string
        source_path:
          type: string
        inputs_contract:
          type: string
        outputs_contract:
          type: string
        model_id:
          type: string
    AgentImportRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/AgentImportItem'
        batch_name:
          type: string
          description: 批次名称（审批单标题）
        batch_approval:
          type: boolean
          default: true
          description: 是否合并为一张批次审批单。默认 true——115 个技能包逐个开单在审批台不可治理
    AgentRegisterResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            agent_id:
              type: string
            status:
              type: string
              enum: [pending_review, active, rejected]
            adapter_type:
              type: string
            registered_by:
              type: string
    ApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        comment:
          type: string
    ApprovalDecisionResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            approval_id:
              type: string
            status:
              type: string
              enum: [approved, rejected]
            decided_by:
              type: string
            decided_at:
              type: string
              format: date-time
            audit_id:
              type: string
    KbDocumentRequest:
      type: object
      required: [title, content, scope]
      properties:
        title:
          type: string
        content:
          type: string
          description: 正文（入库自动向量化）
        scope:
          type: string
          enum: [personal, department, global]
          description: global 仅平台管理员
        dept_id:
          type: string
          description: scope=department 时必填，强制等于 caller.deptId
    KbDocumentResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            doc_id:
              type: string
            scope:
              type: string
            owner_id:
              type: string
            dept_id:
              type: string
            indexed:
              type: boolean
    ModelInfo:
      type: object
      properties:
        model_id:
          type: string
          description: 业务侧使用的模型标识（路由键）
        vendor:
          type: string
          description: 厂商或部署方，private 表示私有化
        adapter:
          type: string
          description: 适配器类型，如 openai_compatible
        capabilities:
          type: array
          items:
            type: string
            enum: [chat, embed, rerank, stream]
        context_window:
          type: integer
          description: 上下文长度（token）
        status:
          type: string
          enum: [active, inactive]
        price_per_1k_prompt:
          type: number
          format: float
        price_per_1k_completion:
          type: number
          format: float
    ModelListResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            models:
              type: array
              items:
                $ref: '#/components/schemas/ModelInfo'
    ModelRegisterRequest:
      type: object
      required: [model_id, vendor, adapter, capabilities, context_window]
      properties:
        model_id:
          type: string
        vendor:
          type: string
        adapter:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum: [chat, embed, rerank, stream]
        context_window:
          type: integer
        price_per_1k_prompt:
          type: number
          format: float
        price_per_1k_completion:
          type: number
          format: float
        default_quota:
          type: integer
          description: 默认部门/智能体月度配额（token）
    ModelRegisterResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            model_id:
              type: string
            status:
              type: string
              enum: [active, inactive]
            registered_by:
              type: string
    UsageRow:
      type: object
      properties:
        key:
          type: string
          description: 维度值（部门ID/用户ID/智能体ID等）
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        cost:
          type: number
          format: float
          description: 折算成本（内部结算货币）
        quota:
          type: number
          description: 周期内配额
        quota_used_pct:
          type: number
          format: float
          description: 配额已用百分比
    UsageSummary:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          properties:
            dimension:
              type: string
              enum: [tenant, dept, user, agent, session]
            period:
              type: string
              description: 统计周期，如 2026-10
            rows:
              type: array
              items:
                $ref: '#/components/schemas/UsageRow'
