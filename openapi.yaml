openapi: 3.0.3
info:
  title: 企业 AI 智能体中台 · 后端接口契约
  version: 1.0.0
  description: >
    移动端 MVP（企微/钉钉/飞书 H5 嵌入）与 PC 共用后端的核心接口定义。
    所有接口在网关层校验 Bearer Token，并由网关从 Token 解析调用者身份注入
    X-Caller-Context 头（前端不可伪造）。召回类接口统一走单一过滤点
    （scope / owner / dept），越权内容在召回阶段即被剔除，不进入大模型上下文。
  contact:
    name: 平台管理员
servers:
  - url: /api/v1
    description: 统一 API 网关前缀
security:
  - bearerAuth: []
tags:
  - name: auth
    description: 身份认证（对接企业 IM）
  - name: rag
    description: 带权召回 / RAG 检索（核心，不可绕过）
  - name: agent
    description: Agent 触发（自然语言映射工作流）
  - name: approval
    description: 审批（入驻 / 共享 / 导出）
  - name: kb
    description: 知识库读写（个人 / 部门）
  - name: models
    description: 模型注册表（可插拔大模型接入，热插拔）
  - name: usage
    description: Token 用量统计与计费（按租户/部门/用户/智能体）
  - name: search
    description: 公网检索（与企业内部 RAG 隔离，M26）
paths:
  /auth/sso/callback:
    post:
      tags: [auth]
      operationId: ssoCallback
      summary: SSO / OAuth 登录回调（企微/钉钉/飞书）
      description: 接收企业 IM 网页授权 code，换取员工身份与部门，并做设备绑定。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCallbackRequest'
            example:
              provider: wecom
              code: "im_oauth_code_abc123"
              device_id: "dev_88f2c1"
              state: "csrf_token_xyz"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoCallbackResponse'
              example:
                code: 0
                data:
                  token: "<jwt>"
                  expires_in: 7200
                  user:
                    userId: "u_1024"
                    name: "张三"
                    deptId: "d_sales"
                    role: "employee"
                  device_bound: true
                  need_stepup: false
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/oidc/health:
    get:
      tags: [auth]
      operationId: oidcHealth
      summary: OIDC 配置自检（issuer 可达 / JWKS 可拉）
      responses:
        '200':
          description: 健康度
          content:
            application/json:
              example: { enabled: true, ok: true, issuer: "http://127.0.0.1:8000" }
  /auth/oidc/exchange:
    post:
      tags: [auth]
      operationId: oidcExchange
      summary: 后端代前端用授权码换 id_token（PKCE，避开浏览器 CORS）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                issuer: { type: string }
                client_id: { type: string }
                redirect_uri: { type: string }
                code: { type: string }
                code_verifier: { type: string }
      responses:
        '200':
          description: 换码成功，返回 id_token（前端作为 Authorization 头发给网关）
          content:
            application/json:
              example:
                code: 0
                data:
                  id_token: "<jwt>"
                  expires_in: 3600
                  user: { userId: "u_1024", name: "张三", deptId: "d_sales", role: "employee" }
        '400':
          description: 未配置 issuer/client_id 或 IdP 未返回 id_token
        '401':
          description: id_token 验签失败
  /auth/oidc/provision:
    post:
      tags: [auth]
      operationId: oidcProvision
      summary: 实验性：把企业微信/钉钉资料一键写入 Casdoor（建 IdP + 关联应用）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer, admin_user, admin_password]
              properties:
                issuer: { type: string }
                admin_user: { type: string }
                admin_password: { type: string }
                owner: { type: string, default: built-in }
                app_name: { type: string, default: app-built-in }
                wecom: { type: object }
                dingtalk: { type: object }
      responses:
        '200':
          description: 写入结果（code=0 成功；code=1 失败并附 steps 便于排错）
  /rag/retrieve:
    post:
      tags: [rag]
      operationId: ragRetrieve
      summary: 带权召回 / RAG 检索（核心，不可绕过）
      description: >
        与 PC 同一召回服务。网关注入调用者身份后，在召回阶段按 scope / owner / dept
        过滤，仅返回授权片段。filtered_out 仅返回被过滤的越权片段计数（不返回内容）。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveRequest'
            example:
              query: "五一活动话术"
              kb_scope: "all"
              top_k: 6
              tenant_id: "t_demo"
      responses:
        '200':
          description: 召回成功（结果已按权限过滤）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveResponse'
              example:
                code: 0
                data:
                  query: "五一活动话术"
                  hits:
                    - doc_id: "doc_8831"
                      title: "五一营销活动方案 v3"
                      snippet: "建议分三档：① 到店礼 ② 满减 ③ 老带新"
                      scope: "department"
                      kb_tier: "department"
                      score: 0.91
                      source: "产品手册 v3"
                      can_access: true
                  filtered_out: 3
                  trace_id: "trace_2026abc"
        '403':
          $ref: '#/components/responses/Forbidden'
  /search/web:
    post:
      tags: [search]
      operationId: webSearch
      summary: 公网检索（联网查资料 / 竞品调研）
      description: >
        与企业内部 RAG 平行但**完全隔离**的通道：结果只在当轮上下文使用，不写入知识库、
        不参与向量检索、不跨租户共享。命中带 origin=public_web，生成侧用 [W编号] 与
        内部片段的 [编号] 分开标注，避免把竞品网页写成公司制度。
        接口不接受自定义 URL；正文抓取只允许本进程刚搜到的链接，且经过字面 + DNS 公网校验。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSearchRequest'
            example:
              query: "东莞 独立储能电站 容量补偿 政策 2026"
              top_k: 6
              fetch_top: 0
      responses:
        '200':
          description: 检索完成（ok=false 时 hits 为空，error 说明原因；不会抛 500）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSearchResponse'
              example:
                code: 0
                data:
                  query: "东莞 独立储能电站 容量补偿 政策 2026"
                  provider: "sogou_html"
                  mode: "free_html"
                  ok: true
                  degraded: false
                  hits:
                    - title: "广东省新型储能发展实施方案"
                      url: "https://example.gov.cn/policy/123"
                      snippet: "独立储能电站可参与现货市场与容量补偿……"
                      origin: "public_web"
                      source: "sogou_html"
                      published_at: "2026-01-15"
                      fetched_at: "2026-11-06 00:30 UTC"
                  elapsed_ms: 820
        '403':
          $ref: '#/components/responses/Forbidden'
  /search/status:
    get:
      tags: [search]
      operationId: webSearchStatus
      summary: 联网通道状态（provider / 是否降级 / 是否配 key）
      description: 只回显「有没有配」，不回显密钥值。前端据此提示结果是否可信。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      responses:
        '200':
          description: 通道状态
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      provider: { type: string, example: bing_html }
                      mode: { type: string, enum: [api, free_html, disabled] }
                      configured: { type: object, additionalProperties: { type: boolean } }
                      allow_fetch: { type: boolean }
                      max_results: { type: integer }
  /agent/invoke:
    post:
      tags: [agent]
      operationId: agentInvoke
      summary: Agent 触发（自然语言映射工作流）
      description: >
        调用者上下文随任务下发，Agent 调用的工具（如 rag_retrieve）同样走带权召回。
        默认 SSE 流式返回，末帧为结构化结果。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentInvokeRequest'
            example:
              agent_id: "sales_script"
              input: "帮我写一版五一活动朋友圈文案"
              stream: true
      responses:
        '200':
          description: 调用成功（SSE 末帧）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInvokeResponse'
              example:
                code: 0
                data:
                  answer: "建议分三档执行五一活动：到店礼、满减、老带新……"
                  citations:
                    - doc_id: "doc_8831"
                      title: "五一营销活动方案 v3"
                      scope: "department"
                  tool_calls:
                    - tool: "rag_retrieve"
                      authorized: true
        '403':
          $ref: '#/components/responses/Forbidden'
  /agent/files:
    post:
      tags: [files]
      operationId: uploadAgentFile
      summary: 上传技能包输入件（M16 文件进出）
      description: |
        multipart 上传 xlsx/xlsm/csv/tsv/txt/md/json，单文件上限 20MB。
        上传即解析并回结构预览（表头/列画像/样本）；解析失败不拒收，
        而是把 parse_ok=false 与原因回给前端，执行时由模型明确告知用户。
        同一用户重复上传同一文件（sha256 相同）复用原记录。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    allOf:
                      - $ref: '#/components/schemas/AgentFile'
                      - type: object
                        properties:
                          preview:
                            type: object
                            description: 表格结构预览（ok/sheet_count/total_rows/sheets）
                          object_store_available:
                            type: boolean
        '413':
          description: 文件超过 20MB
        '415':
          description: 不支持的文件类型
    get:
      tags: [files]
      operationId: listAgentFiles
      summary: 可见文件列表（M16）
      description: 默认仅本人；部门管理员可见本部门、平台管理员全量。产出物可按 run_id 精确定位。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: kind
          in: query
          schema:
            type: string
            enum: [upload, artifact]
        - name: run_id
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 文件列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      files:
                        type: array
                        items:
                          $ref: '#/components/schemas/AgentFile'
                      count:
                        type: integer
                      stats:
                        type: object
  /agent/files/stats:
    get:
      tags: [files]
      operationId: agentFilesStats
      summary: 文件存储健康度（M16）
      description: 文件量与字节数 + 对象存储是否在线（MinIO 不可达时走内存兜底）。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      responses:
        '200':
          description: 存储统计
          content:
            application/json:
              schema:
                type: object
  /agent/files/{file_id}:
    get:
      tags: [files]
      operationId: downloadAgentFile
      summary: 下载原件或产出物（M16）
      description: |
        后端代理下载（带鉴权），不是对象存储预签名直链——避免把 MinIO 端口暴露给浏览器。
        无权与不存在统一返回 404，避免靠枚举探测他人文件。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 文件字节流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: 文件不存在或无权访问
    delete:
      tags: [files]
      operationId: deleteAgentFile
      summary: 删除文件（M16，仅上传者本人或平台管理员）
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 已删除
        '403':
          $ref: '#/components/responses/Forbidden'
  /agent/files/{file_id}/preview:
    get:
      tags: [files]
      operationId: previewAgentFile
      summary: 表格结构预览（M16）
      description: 回表头、列画像（类型/空值率/唯一值数）与前 20 行，用于执行前核对口径。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 结构预览
          content:
            application/json:
              schema:
                type: object
  /agent/sessions:
    get:
      tags: [agent]
      operationId: listSessions
      summary: 会话列表（M7 会话管理）
      description: >
        返回调用者可见的会话列表（按最后更新时间倒序）。默认仅本人会话；
        `all=true` 仅平台管理员可用（运维排查），其他人传 all=true 返回 403。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 200 }
        - name: all
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: 仅平台管理员可传 true
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  count: 1
                  sessions:
                    - session_id: "sess_9f2b1c4d8e6a"
                      agent_id: "ag_sales_script"
                      turn_count: 4
                      last_role: "assistant"
                      last_message: "建议分三档执行五一活动……"
                      updated_at: 1793600000.0
        '403':
          $ref: '#/components/responses/Forbidden'
  /agent/sessions/{session_id}:
    get:
      tags: [agent]
      operationId: getSessionMemory
      summary: 查看会话记忆 + 完整轮次（M4/M18）
      description: >
        返回指定会话的轮次摘要、完整 turns 与最近上下文预览。仅会话创建者本人可访问
        （第 18 章权限语义延伸到会话）；非本人访问 403。
        界面侧栏点开历史对话时用 turns 恢复，产出物与「是否真模型」跟着轮次一起返回。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 会话记忆
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMemory'
    delete:
      tags: [agent]
      operationId: deleteSession
      summary: 删除会话（M7 会话管理）
      description: >
        仅会话创建者本人可删；PG 副本一并删除，避免重启后会话复活。
        非本人访问 403，不存在 404。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data: { session_id: "sess_9f2b1c4d8e6a", deleted: true }
        '403':
          $ref: '#/components/responses/Forbidden'
  /agents:
    post:
      tags: [agent]
      operationId: registerAgent
      summary: 注册新智能体（写入选型结论）
      description: >
        新建智能体。adapter_type 来自模型选型向导结论（第 35 章）；knowledge_scope 受 RBAC 与
        单一过滤点约束（本人 / 负责人 / 部门 / 集团）。服务端以 caller 为准强制回填 owner_id / dept_id，
        前端传入仅作展示，越权写被过滤点拦截。注册后进入待发布评审（第 35 章红线：缺选型不可发布）。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRegisterRequest'
            example:
              agent_id: "contract_review"
              name: "合同合规审查助手"
              adapter_type: "llm_retrieval"
              description: "基于企业知识库问答必须 RAG；先做混合检索+重排，Recall@100≥0.95 门禁，再生成。"
              knowledge_scope: "department"
              model_id: "qwen-local"
      responses:
        '200':
          description: 注册成功（进入待发布评审）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRegisterResponse'
              example:
                code: 0
                data:
                  agent_id: "contract_review"
                  status: "pending_review"
                  adapter_type: "llm_retrieval"
                  registered_by: "u_1024"
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [agent]
      operationId: listAgents
      summary: 智能体清单（可按岗位 / 分类 / 状态过滤）
      description: >
        按可见域（RBAC）返回智能体。传 `role` 时按岗位收窄：只回本岗业务包 + 公共库 +
        内置通用助手——这是"选完岗位只看到自己的技能和公共库"的服务端落点。
        岗位是**视图过滤，不是权限**：可见范围仍由 RBAC 决定，岗位只决定先摆哪些。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: role
          in: query
          required: false
          schema: { type: string }
          description: 岗位 id 或中文名（如 finance / 财务）
        - name: category
          in: query
          required: false
          schema: { type: string, enum: [industry, office, public] }
          description: 行业类 / 办公角色 / 公共库
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending_review, published, rejected] }
      responses:
        '200':
          description: 智能体清单（agents / count / status_stats）
  /agents/import:
    post:
      tags: [agent]
      operationId: importAgents
      summary: 批量导入技能包（M15）
      description: >
        把 prompt-as-skill 形态的技能包（skill.md）批量注册为智能体。默认合并为**一张批次
        审批单**——逐个开单会让审批台不可治理。导入后状态一律 pending_review，仍受第 35 章红线
        约束：审批通过前不可调用。`source_path` 相同视为同一技能包，重复导入跳过（幂等）。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentImportRequest'
            example:
              batch_name: "办公角色技能包首批导入"
              batch_approval: true
              items:
                - name: "经营复盘"
                  description: "月度经营复盘，五条线判定+矛盾检测+四层归因"
                  system_prompt: "你是「经营复盘」执行专家……"
                  adapter_type: "llm"
                  knowledge_scope: "department"
                  category: "industry"
                  category_cn: "制造业"
                  source_path: "01_制造业/02_经营复盘/skill.md"
      responses:
        '200':
          description: 导入完成（进入待发布评审）
        '400':
          $ref: '#/components/responses/BadRequest'
  /agents/catalog:
    get:
      tags: [agent]
      operationId: agentCatalog
      summary: 技能包分类目录（职业 + 行业 + 公共库）
      description: >
        返回三套目录：`roles` 按职业（财务/人事/销售/行政/采购供应链/生产计划/品质工程/
        市场运营/电商运营/客服/管理者）分组，`categories` 按行业（制造业/零售/跨境电商/
        办公角色）分组，`public` 为公共库（文案生成 / PPT 制作 / 表格制作等 10 个办公基础
        技能，跟岗位无关）。前端默认展示职业视角——员工按岗位找工具，不按行业找。
        仅返回当前身份可见的智能体。内置通用助手与公共库均不计入 `total` / `role_total`
        的业务口径（115 个技能包保持 115）。
        传 `role` 时按岗位收窄：只回本岗业务包 + 公共库。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: role
          in: query
          required: false
          schema: { type: string }
          description: 岗位 id 或中文名（如 finance / 财务）；传了只回本岗 + 公共库
      responses:
        '200':
          description: 分类目录（categories / roles / public / total / role_total / public_total）
  /agents/roles:
    get:
      tags: [agent]
      operationId: listRoles
      summary: 职业工作台（选岗位 → 常用 AI 先配进去）
      description: >
        不传 `role` 返回全部职业目录（含各自技能包数量与 core 数量）。
        传 `role`（id 或中文名，如 `finance` / `财务`）返回该岗位的完整清单：
        `core` 为 4 个开箱即用的默认配置（按岗位最高频场景排序），`rest` 为其余可选扩展。
        同一技能包可挂多个岗位（如「对账与开票核对」既属制造业也属财务），
        但主职业唯一，故各岗位计数之和等于技能包总数。
        两份响应都附 `public`（公共库 10 个办公基础技能）：岗位工作台 = 本岗技能 + 公共库。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: role
          in: query
          required: false
          schema: { type: string }
          description: 职业 id 或中文名；缺省返回目录
      responses:
        '200':
          description: 职业目录 / 该岗位的技能包清单
        '404':
          description: 未知职业
  /approval/{approval_id}/decide:
