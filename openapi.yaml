        - $ref: '#/components/parameters/CallerContext'
      responses:
        '200':
          description: 语料画像
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  documents: 250
                  total_chars: 73919
                  avg_chars: 295.7
                  by_scope: {department: 250}
                  by_dept: {d_sales: 250}
                  by_source: {bulk_import: 250}
                  truncated_documents: 0
                  unique_hashes: 250
                  index_char_cap: 20000
                  object_store_available: true
                  pg_available: true
                  pg_persisted: true

  /kb/index:
    get:
      tags: [kb]
      operationId: getKbIndex
      summary: 索引健康（M9，规模化后第一诊断屏）
      description: >
        规模（父文档 / 子块 / 已分配容量 / tombstone / 词表）+ 构建耗时 +
        最近一次查询延迟 + embedding 缓存命中 + 向量后端。试点排障第一眼看的接口：
        「为什么今天回答变慢」「重启后多久能恢复」都在这一屏回答。
        `vector_store.backend` 为 memory 表示跑在进程内 numpy 矩阵；
        切 qdrant 时 `available=false` 会自动降级回 memory 并在 `error` 里写明原因。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      responses:
        '200':
          description: 索引健康画像
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  documents: 2720
                  children: 33712
                  children_allocated: 33712
                  tombstones: 0
                  vocab: 3652
                  avg_child_tokens: 33.16
                  chars: 788792
                  depts: 1
                  by_scope: {department: 2720}
                  demo_documents: 0
                  build_ms: 0.0
                  vector_backend: numpy
                  vec_bytes: 138084352
                  last_query_ms: 17.71
                  query_count: 36
                  max_children: 200000
                  capacity_used_pct: 0.16856
                  embed_cache:
                    enabled: true
                    available: true
                    entries: 33712
                    hits: 33712
                    misses: 0
                    hit_rate: 1.0
                    pending: 0
                    errors: 0
                  vector_store:
                    requested: memory
                    backend: memory
                    available: false
                    points: null
                    mode: http
                    error: null

  /kb/ingest:
    post:
      tags: [kb]
      operationId: createKbIngestJob
      summary: 异步导入任务（M10，万篇级：提交即返回）
      description: >
        同步 `/kb/documents/bulk` 一次最多 50 个文件、请求里等结果；1 万篇要分 200 次请求。
        这里一次提交整批（≤20000 篇），服务端单 worker 每 200 篇一批入库，
        返回 `job_id` 由 `GET /kb/ingest/{job_id}` 轮询进度。
        任务单只存内存，重启丢任务单不丢数据（已入库的文档在 PG）。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents:
                  type: array
                  items:
                    type: object
                    required: [content]
                    properties:
                      title: {type: string}
                      content: {type: string}
                      filename: {type: string}
                scope: {type: string, enum: [personal, department, global], default: department}
                dept_id: {type: string, nullable: true}
            example:
              documents:
                - {title: "2026 渠道政策", filename: "渠道政策.md", content: "一级经销商年度返点 8%…"}
                - {title: "售后备件", filename: "备件.md", content: "常用备件安全库存 20 套…"}
              scope: department
      responses:
        '200':
          description: 任务已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  job_id: job_4cae2b30ac
                  status: running
                  total: 1200
                  processed: 0
                  added: 0
                  duplicated: 0
                  failed: 0
                  failures: []
                  scope: department
                  dept_id: d_sales
                  object_store_available: true
        '400':
          description: documents 为空
        '403':
          description: 越权范围（跨部门 / 员工写 global）
        '413':
          description: 单任务超过 20000 篇
    get:
      tags: [kb]
      operationId: listKbIngestJobs
      summary: 最近导入任务（本人；平台管理员看全租户）
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: limit
          in: query
          schema: {type: integer, default: 20, maximum: 100}
      responses:
        '200':
          description: 任务列表（新→旧）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  count: 1
                  jobs:
                    - {job_id: job_4cae2b30ac, status: done, total: 1200, processed: 1200, added: 1198, duplicated: 2, failed: 0, elapsed_s: 11.4}

  /kb/ingest/{job_id}:
    get:
      tags: [kb]
      operationId: getKbIngestJob
      summary: 查导入进度（processed 单调递增，status=done 即完成）
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  job_id: job_4cae2b30ac
                  status: done
                  total: 1200
                  processed: 1200
                  added: 1198
                  duplicated: 2
                  failed: 0
                  failures: []
                  chars_added: 512340
                  elapsed_s: 11.4
                  error: null
        '404':
          description: 任务不存在或无权查看

  /kb/ingest/{job_id}/cancel:
    post:
      tags: [kb]
      operationId: cancelKbIngestJob
      summary: 取消导入（尽力而为：当前批跑完就停，已入库的不回滚）
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 已请求取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data: {job_id: job_4cae2b30ac, status: cancelling}
        '409':
          description: 任务不存在、已终态或无权取消

  /usage/trend:
    get:
      tags: [usage]
      operationId: getUsageTrend
      summary: 成本曲线（M8，逐日真落账 + 月末外推 + 预算水位）
      description: >
        按自然日连续补齐（没有调用的日子补 0，避免折线把空白日连成直线）。
        月末外推 = 本月已发生 + 近 7 个自然日日均 × 当月剩余天数。
      parameters:
        - $ref: '#/components/parameters/CallerContext'
        - name: days
          in: query
          schema: {type: integer, minimum: 1, maximum: 365, default: 14}
      responses:
        '200':
          description: 成本趋势
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                code: 0
                data:
                  window_days: 14
                  series:
                    - {date: "2026-11-02", calls: 66, real_calls: 0, tokens: 11204, cost: 0.0291}
                  calls: 66
                  tokens: 11204
                  cost: 0.0291
                  active_days: 1
                  zero_days: 13
                  peak_day: {date: "2026-11-02", cost: 0.0291}
                  month_to_date_cost: 0.0291
                  days_in_month: 30
                  elapsed_days: 2
                  avg_7d_cost: 0.0042
                  projected_month_cost: 0.15
                  budget_cny: 500.0
                  budget_used_pct: 0.01
                  projected_budget_pct: 0.03
                  budget_status: ok
                  currency: CNY

