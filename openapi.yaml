openapi: 3.1.0
info:
  title: 企业 AI 智能体中台 · 后端接口契约
  version: 1.0.0
  description: '移动端 MVP（企微/钉钉/飞书 H5 嵌入）与 PC 共用后端的核心接口定义。 所有接口在网关层校验 Bearer Token，并由网关从 Token 解析调用者身份注入 X-Caller-Context 头（前端不可伪造）。召回类接口统一走单一过滤点 （scope / owner / dept），越权内容在召回阶段即被剔除，不进入大模型上下文。

    '
  contact:
    name: 平台管理员
paths:
  /agent/files:
    post:
      tags:
      - files
      summary: Upload File
      description: 上传技能包的输入件（xlsx/csv/txt）。返回 file_id 供 /agent/invoke 引用。
      operationId: upload_file_api_v1_agent_files_post
      parameters:
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_file_api_v1_agent_files_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - files
      summary: List Files
      operationId: list_files_api_v1_agent_files_get
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
          description: upload|artifact，空为全部
          default: ''
          title: Kind
        description: upload|artifact，空为全部
      - name: run_id
        in: query
        required: false
        schema:
          type: string
          description: 按某次执行过滤（取产出物）
          default: ''
          title: Run Id
        description: 按某次执行过滤（取产出物）
      - name: agent_id
        in: query
        required: false
        schema:
          type: string
          description: 按智能体过滤
          default: ''
          title: Agent Id
        description: 按智能体过滤
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agent/files/stats:
    get:
      tags:
      - files
      summary: Files Stats
      operationId: files_stats_api_v1_agent_files_stats_get
      parameters:
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agent/files/{file_id}:
    get:
      tags:
      - files
      summary: Download File
      operationId: download_file_api_v1_agent_files__file_id__get
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - files
      summary: Delete File
      operationId: delete_file_api_v1_agent_files__file_id__delete
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agent/files/{file_id}/preview:
    get:
      tags:
      - files
      summary: Preview File
      operationId: preview_file_api_v1_agent_files__file_id__preview_get
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agent/invoke:
    post:
      tags:
      - agent
      summary: Invoke Agent
      operationId: invoke_agent_api_v1_agent_invoke_post
      parameters:
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentInvokeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agent/sessions:
    get:
      tags:
      - agent
      summary: List Sessions
      description: 会话列表：默认仅本人；`all=true` 仅平台管理员可用（运维排查用）。
      operationId: list_sessions_api_v1_agent_sessions_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 20
          title: Limit
      - name: all
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: All
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agent/sessions/{session_id}:
    get:
      tags:
      - agent
      summary: Get Session Memory
      description: 查看会话记忆（仅会话创建者本人，第18章权限语义延伸到会话）。
      operationId: get_session_memory_api_v1_agent_sessions__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - agent
      summary: Delete Session
      operationId: delete_session_api_v1_agent_sessions__session_id__delete
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agents:
    post:
      tags:
      - agent
      summary: Register Agent
      operationId: register_agent_api_v1_agents_post
      parameters:
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRegisterRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRegisterResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - agent
      summary: List Agents
      operationId: list_agents_api_v1_agents_get
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
          description: 按分类过滤：industry|office|public
          default: ''
          title: Category
        description: 按分类过滤：industry|office|public
      - name: role
        in: query
        required: false
        schema:
          type: string
          description: 岗位 id 或中文名；传了只回本岗 + 公共库 + 通用助手
          default: ''
          title: Role
        description: 岗位 id 或中文名；传了只回本岗 + 公共库 + 通用助手
      - name: status
        in: query
        required: false
        schema:
          type: string
          description: 按状态过滤：pending_review|published|rejected
          default: ''
          title: Status
        description: 按状态过滤：pending_review|published|rejected
      - name: all
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: All
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agents/catalog:
    get:
      tags:
      - agent
      summary: Agent Catalog
      description: '三块目录：categories（按行业）+ roles（按职业）+ public（公共库）。


        前端默认展示 roles——员工按岗位找工具，不按行业找。'
      operationId: agent_catalog_api_v1_agents_catalog_get
      parameters:
      - name: role
        in: query
        required: false
        schema:
          type: string
          description: 岗位 id 或中文名；传了只回本岗 + 公共库
          default: ''
          title: Role
        description: 岗位 id 或中文名；传了只回本岗 + 公共库
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agents/import:
    post:
      tags:
      - agent
      summary: Import Agents
      description: '批量导入技能包（M15）。


        默认 `batch_approval=True`：全部进 pending_review 并合并成一张批次单，

        审批一次整批发布。审批台不会被 115 张单淹没。'
      operationId: import_agents_api_v1_agents_import_post
      parameters:
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentImportRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agents/my-role:
    get:
      tags:
      - agent
      summary: My Role
      description: 前端启动时取一次：ROLE_FROM_ORG=1 时应以这里返回的岗位为准。
      operationId: my_role_api_v1_agents_my_role_get
      parameters:
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agents/roles:
    get:
      tags:
      - agent
      summary: List Roles
      description: '职业工作台：不传 role 返回全部职业目录；传了返回该职业的完整技能包清单。


        这是「选职业 → 相应的 AI 先配进去」的落地接口：

        core=True 的 4 个是该岗开箱即用的默认配置，其余是该岗可选扩展。

        M22 起两份响应都带 public（公共库），因为「本岗技能 + 公共库」才是完整工作台。'
      operationId: list_roles_api_v1_agents_roles_get
      parameters:
      - name: role
        in: query
        required: false
        schema:
          type: string
          description: 职业 id 或中文名，如 finance / 财务
          default: ''
          title: Role
        description: 职业 id 或中文名，如 finance / 财务
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /approval/pending:
    get:
      tags:
      - approval
      summary: Pending
      description: '待审列表：platform_admin 全量，dept_admin 本部门 + 本租户。


        only_my_stage=true 时仅返回当前级可由该调用人审批的单据（含租户/部门/级别约束）。'
      operationId: pending_api_v1_approval_pending_get
      parameters:
      - name: only_my_stage
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Only My Stage
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /approval/{approval_id}:
    get:
      tags:
      - approval
      summary: Ticket Detail
      description: 审批单详情（含多级进度）；申请人本人或管理员可读。
      operationId: ticket_detail_api_v1_approval__approval_id__get
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
          title: Approval Id
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /approval/{approval_id}/assist:
    post:
      tags:
      - approval
      summary: Assist
      description: '审批助手（辅助层）：返回申请草稿/摘要/合规风险建议，不落账。


        enrich=true 时额外调用真模型通道生成一句话自然语言提示（llm_hint），

        真模型不可用则优雅降级（不出 llm_hint，不影响结构化结论）。

        权限：申请人本人或管理员可读；最终 approve/reject 仍由审批台 decide() 落账。'
      operationId: assist_api_v1_approval__approval_id__assist_post
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
          title: Approval Id
      - name: enrich
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Enrich
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /approval/{approval_id}/decide:
    post:
      tags:
      - approval
      summary: Decide
      operationId: decide_api_v1_approval__approval_id__decide_post
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
          title: Approval Id
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDecisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /audit/export:
    post:
      tags:
      - audit
      summary: Export Audit
      description: '只读导出 caller 可见的审计记录（RBAC 收敛，不改数据）。仅平台管理员。


        配置了 AUDIT_EXPORT_KEY 时加密导出（.enc），否则明文 CSV（并告警）。'
      operationId: export_audit_api_v1_audit_export_post
      parameters:
      - name: encrypt
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Encrypt
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /audit/health:
    get:
      tags:
      - audit
      summary: Audit Health
      operationId: audit_health_api_v1_audit_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /audit/logs:
    get:
      tags:
      - audit
      summary: Get Audit Logs
      operationId: get_audit_logs_api_v1_audit_logs_get
      parameters:
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 过滤动作：retrieve/generate/download/approval
          title: Action
        description: 过滤动作：retrieve/generate/download/approval
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /audit/purge:
    post:
      tags:
      - audit
      summary: Purge Audit
      description: 按留存策略清理过期审计（法定保留动作永不过期）。仅平台管理员。
      operationId: purge_audit_api_v1_audit_purge_post
      parameters:
      - name: retention_days
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Retention Days
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/branding:
    get:
      tags:
      - auth
      summary: Current Branding
      description: 登录后取当前租户品牌（含平台默认回落）。供前端按租户渲染登录后界面。
      operationId: current_branding_api_v1_auth_branding_get
      parameters:
      - name: x-caller-context
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/oidc/exchange:
    post:
