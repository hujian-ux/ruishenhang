  /models/gateway:
    get:
      tags: [models]
      operationId: gatewayHealth
      summary: 模型网关探活（M7 页面状态灯）
      description: 返回 LiteLLM 是否可达、网关地址与当前默认路由模型；不可达时业务自动回退 stub。
