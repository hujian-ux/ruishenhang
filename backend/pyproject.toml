[project]
name = "enterprise-ai-platform-backend"
version = "0.1.0"
description = "企业 AI 智能体中台 · 后端单体（先单体后拆容器）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # 以下为 M1/M2 接入所需，默认未装也不影响骨架运行
    "sqlalchemy>=2.0",        # PostgreSQL ORM
    "qdrant-client>=1.9",     # 向量检索（第36章）
    "minio>=7.2",             # 文件网关（第23章）
    "redis>=5.0",             # 语义缓存（第40章）
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.6",  # 中文 bge 嵌入（决策：bge-m3）
    "langgraph>=0.2",              # 智能体运行时（决策：LangGraph 为主框架）
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
