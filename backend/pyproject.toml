[project]
name = "enterprise-ai-platform-backend"
version = "0.1.0"
description = "企业 AI 智能体中台 · 后端单体（先单体后拆容器）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # 知识库上传端点用了 UploadFile/File/Form（routers/kb.py）。
    # FastAPI 在**注册路由时**就检查这个包，缺了会让 app 导入阶段直接失败——
    # 不是上传时才报错，是整个服务起不来。本地 venv 里曾恰好有它，
    # 直到 CI 用干净环境 `pip install -e ".[dev]"` 才暴露（9 个测试文件 collection error）。
    "python-multipart>=0.0.9",
    # 以下为 M1/M2 接入所需，默认未装也不影响骨架运行
    "sqlalchemy>=2.0",        # PostgreSQL ORM
    "qdrant-client>=1.9",     # 向量检索（第36章）
    "minio>=7.2",             # 文件网关（第23章）
    "redis>=5.0",             # 语义缓存（第40章）
    # M12 真实身份：OIDC/JWT 校验（RS256，JWKS 自动拉取）。不配 issuer 时只走 dev 分支，CI 不受影响。
    "pyjwt[crypto]>=2.8",
    # P1-173 IM/OA：企业微信回调消息体 AES-256-CBC 解密（EncodingAESKey 派生 32B key）。
    # 用 pycryptodome（PyCryptodome 的 AES 实现稳定且不依赖系统 openssl 版本）。
    "pycryptodome>=3.20",
    # M16 文件进出：xlsx 读写（技能包本质是 xlsx 进 xlsx 出）。
    # tabular.parse 在缺包时会降级成 ok=False 而不是崩，但「表格真的能解析」是要断言的，
    # 所以必须进主依赖，否则 CI 干净环境里 M16 用例会挂。
    "openpyxl>=3.1",
    # M17 多格式产出物：Word / PPT / PDF。
    # HTML 自己拼字符串（不引 markdown 库），少一个依赖少一处渲染差异。
    # reportlab 4.x 把 rlPyCairo 列成硬依赖，但它只在 cairo 后端用到；
    # 离线/内网安装时报错就先 `pip install --no-deps reportlab`（见 docs/M17）。
    "python-docx>=1.1",       # Word
    "python-pptx>=0.6.23",    # PPT
    "reportlab>=4.0",         # PDF（platypus 直绘，不依赖 Office/LibreOffice）
    # M28 语料投递包：把客户原始 docx/xlsx/pdf 转成 ingest_corpus 能吃的纯文本。
    # 只抽文字层；扫描件 PDF 会明确报「需要 OCR」，不静默当成功。
    "pypdf>=6.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.6",  # 中文 bge 嵌入（决策：bge-m3）
    "langgraph>=0.2",              # 智能体运行时（决策：LangGraph 为主框架）
]
infra = [
    "psycopg2-binary>=2.9",        # M6 PG 持久层（写穿会话/审批单）
    "boto3>=1.34",                 # M6 MinIO 对象存储备选 SDK（默认用 minio 包）
    "minio>=7.2",                  # M6 对象存储客户端（S3 协议）
    "moto[server]>=5.0",           # 本地 S3 兼容服务（MinIO 免费 Windows 二进制已下架时的替身）
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
