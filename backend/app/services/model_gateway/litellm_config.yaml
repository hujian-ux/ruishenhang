# LiteLLM 模型网关配置（第25章）
# 业务侧通过 model_id 透明路由；新增厂商只需在此登记，平台代码不动。
model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: qwen-local
    litellm_params:
      model: openai/qwen-local   # 指向本地/私有 OpenAI 兼容端点
      api_base: http://host.docker.internal:8001/v1
  - model_name: bge-m3
    litellm_params:
      model: openai/bge-m3
      api_base: http://host.docker.internal:8002/v1   # 本地嵌入服务（中文 bge）

  # 国内可用：通义千问（DashScope OpenAI 兼容端点），设 DASHSCOPE_API_KEY 即生效
  - model_name: qwen-plus
    litellm_params:
      model: openai/qwen-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
  - model_name: qwen-turbo
    litellm_params:
      model: openai/qwen-turbo
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

litellm_settings:
  drop_params: true
