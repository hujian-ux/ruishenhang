# 企业 AI 智能体中台 · 基础设施即代码（仅底座）
# 决策：先单体后拆容器 —— 后端应用(backend) 本地直接运行，本 compose 只编排外部依赖。
# 上线阶段可把 backend 也加为 service（见 backend/Dockerfile，已就绪但默认不启用）。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aiplat
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${PG_PASSWORD:-dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d aiplat"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  litellm:
    # 官方镜像（Docker Hub 的 litellm/litellm 标签常拉不到；若 ghcr 拉取慢，见 M6_VALIDATION.md 常见坑）
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./backend/app/services/model_gateway/litellm_config.yaml:/app/config.yaml:ro
    environment:
      # 第25章模型网关：本地/私有模型与公有云密钥在此注入，业务侧通过 model_id 透明路由
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # 新版 LiteLLM 默认要求鉴权：本地开发用 unsafe 开关免密；
      # 生产请设 LITELLM_MASTER_KEY（后端同名环境变量透传 Authorization）。
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY: ${LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY:-true}

  # ── 应用本身（「后拆容器」阶段，默认不启用；用 --profile app 才起）──
  # 设计：本地 dev 仍直接跑 backend（先单体）；上线时再 `docker compose --profile app up -d` 把应用也容器化。
  # 默认内存模式启动（PG/Qdrant/MinIO/Redis 不可达自动兜底），与本地演示一致；
  # 要持久化时，把下面注释的 QDRANT_HOST/MINIO_ENDPOINT/REDIS_URL/PG DSN 打开，并加 depends_on 即可。
  backend:
    build: ./backend
    profiles: ["app"]
    env_file: .env
    # environment:
    #   QDRANT_HOST: qdrant
    #   MINIO_ENDPOINT: minio:9000
    #   REDIS_URL: redis://redis:6379/0
    #   POSTGRES_DSN: postgresql://app:${PG_PASSWORD:-dev}@postgres:5432/aiplat
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    # depends_on:
    #   postgres: { condition: service_healthy }
    #   qdrant:   { condition: service_healthy }

volumes:
  pgdata:
  qdrant_storage:
  minio_data:
  redis_data:
